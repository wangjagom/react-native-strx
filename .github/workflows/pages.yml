name: Docs site

on:
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/build-site.mjs
      - tokens.json
      - MIGRATION.md
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
        env:
          # Optional repository variables for a custom domain, e.g.
          # SITE_URL=https://strx.dev/ and SITE_CNAME=strx.dev
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_CNAME: ${{ vars.SITE_CNAME }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
